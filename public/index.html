<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E1829" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #080f1b;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-width: 0;
      }
      input,
      textarea,
      select {
        font-size: 16px;
      }
      :focus-visible {
        outline: 2px solid #8db8ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to open KLUST Campus Store.</noscript>
    <div id="root"></div>
  </body>
</html>
